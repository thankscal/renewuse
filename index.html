<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作經歷自動填表系統 - 專業版</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
            display: none;
        }
        .progress-bar-container {
            width: 80%; max-width: 600px; height: 20px;
            background: #e0e0e0; border-radius: 10px; overflow: hidden; margin-top: 20px;
        }
        .progress-bar {
            width: 0%; height: 100%; background: #3b82f6;
            transition: width 0.3s ease;
        }
        input[type="text"], input[type="date"], select {
            border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 0.5rem; width: 100%;
        }
        .checkbox-group {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-10">
        <h1 class="text-3xl font-bold text-blue-800 mb-2 text-center">工作經歷自動填表系統</h1>
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
            <p class="text-yellow-700 font-bold">1. 本網頁不收費，跟你收費是詐騙。</p>
            <p class="text-yellow-700 font-bold">2. 在修護家族下載完QP後，請留存檔案為 .docx 格式，網頁才能使用。</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="space-y-4">
                <h2 class="text-xl font-semibold border-b pb-2 text-blue-700">基本資訊</h2>
                <div><label class="block text-sm font-medium mb-1">我的名字</label><input type="text" id="name" placeholder="請輸入姓名"></div>
                <div><label class="block text-sm font-medium mb-1">工號</label><input type="text" id="id_no" placeholder="請輸入工號"></div>
                <div><label class="block text-sm font-medium mb-1">生日</label><input type="date" id="birthday"></div>
                <div><label class="block text-sm font-medium mb-1">國籍</label><input type="text" id="nationality" value="台灣"></div>
                <div><label class="block text-sm font-medium mb-1">永久住址</label><input type="text" id="address" placeholder="請輸入住址"></div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xl font-semibold border-b pb-2 text-blue-700">執照與聘僱</h2>
                <div><label class="block text-sm font-medium mb-1">執照號碼</label><input type="text" id="license_no" placeholder="請輸入執照號碼"></div>
                <div><label class="block text-sm font-medium mb-1">執照類別</label><input type="text" id="license_type" value="B1.1"></div>
                <div>
                    <label class="block text-sm font-medium mb-1">工作地點</label>
                    <select id="location"><option value="桃園">桃園 (CAL-EMO/CKS)</option><option value="高雄">高雄 (CAL-EMO/KHH)</option></select>
                </div>
                <div><label class="block text-sm font-medium mb-1">聘僱日期 (自)</label><input type="date" id="hire_date"></div>
                <div>
                    <label class="block text-sm font-medium mb-1">職務</label>
                    <div class="flex gap-4 mt-1">
                        <label><input type="radio" name="position" value="技術員" checked> 技術員</label>
                        <label><input type="radio" name="position" value="領工"> 領工</label>
                        <label><input type="radio" name="position" value="領班"> 領班</label>
                        <label><input type="radio" name="position" value="組長"> 組長</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-xl font-semibold border-b pb-2 text-blue-700 mb-4">工作機型 (複選)</h2>
            <div class="checkbox-group" id="aircraft_types">
                <label class="flex items-center gap-2"><input type="checkbox" value="B737-800"> B737-800</label>
                <label class="flex items-center gap-2"><input type="checkbox" value="B747-400"> B747-400</label>
                <label class="flex items-center gap-2"><input type="checkbox" value="B-777-300"> B-777-300</label>
                <label class="flex items-center gap-2"><input type="checkbox" value="B787"> B787</label>
                <label class="flex items-center gap-2"><input type="checkbox" value="A330-300"> A330-300</label>
                <label class="flex items-center gap-2"><input type="checkbox" value="A350-900"> A350-900</label>
                <label class="flex items-center gap-2"><input type="checkbox" value="A321NEO"> A321NEO</label>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                <label class="block text-sm font-bold text-blue-800 mb-2">1. 上傳 三頁QP模板.docx</label>
                <input type="file" id="template_file" accept=".docx" class="w-full text-sm">
            </div>
            <div class="p-4 bg-green-50 rounded-lg border border-green-200">
                <label class="block text-sm font-bold text-green-800 mb-2">2. 上傳 工作經歷.xlsx</label>
                <input type="file" id="data_file" accept=".xlsx" class="w-full text-sm">
            </div>
        </div>

        <button id="process_btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition duration-200 text-lg">
            產生並下載 WORD
        </button>

        <div id="status_container" class="mt-6 hidden">
            <div class="progress-bar-container"><div id="progress_bar" class="progress-bar"></div></div>
            <p id="status_text" class="text-center mt-2 text-gray-600 font-medium">準備中...</p>
            <p id="timer_text" class="text-center text-sm text-blue-500 mt-1">預計剩餘時間: -- 秒</p>
        </div>
    </div>

    <div id="loading_overlay" class="loading-overlay">
        <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-600"></div>
        <p class="mt-4 text-blue-800 font-bold">系統初始化中，請稍候...</p>
    </div>

    <script type="py" config='{"packages": ["python-docx", "pandas", "openpyxl"]}'>
import asyncio
import pandas as pd
import io
import copy
from datetime import datetime
from docx import Document
from docx.shared import Pt
from docx.enum.table import WD_ROW_HEIGHT_RULE
from js import document, Uint8Array, File, URL, window
from pyodide.ffi import create_proxy

async def process_word(e):
    try:
        # 顯示進度條
        status_container = document.getElementById("status_container")
        status_container.classList.remove("hidden")
        progress_bar = document.getElementById("progress_bar")
        status_text = document.getElementById("status_text")
        timer_text = document.getElementById("timer_text")

        def update_progress(p, text, seconds):
            progress_bar.style.width = f"{p}%"
            status_text.innerText = text
            timer_text.innerText = f"預計剩餘時間: {seconds} 秒"

        update_progress(5, "讀取檔案中...", 15)
        await asyncio.sleep(0.1)

        # 獲取檔案
        template_input = document.getElementById("template_file")
        data_input = document.getElementById("data_file")
        
        if not template_input.files.item(0) or not data_input.files.item(0):
            window.alert("請上傳兩個檔案！")
            return

        template_bytes = await template_input.files.item(0).arrayBuffer()
        data_bytes = await data_input.files.item(0).arrayBuffer()
        
        # 讀取 Excel
        df = pd.read_excel(io.BytesIO(data_bytes.to_py()))
        
        # 讀取 Word
        doc = Document(io.BytesIO(template_bytes.to_py()))
        
        update_progress(20, "填寫個人資訊...", 12)
        await asyncio.sleep(0.1)

        # 獲取表單數據
        name = document.getElementById("name").value
        id_no = document.getElementById("id_no").value
        birthday = document.getElementById("birthday").value
        nationality = document.getElementById("nationality").value
        address = document.getElementById("address").value
        license_no = document.getElementById("license_no").value
        license_type = document.getElementById("license_type").value
        loc_choice = document.getElementById("location").value
        hire_date = document.getElementById("hire_date").value
        
        pos_elements = document.getElementsByName("position")
        position = "技術員"
        for el in pos_elements:
            if el.checked: position = el.value
            
        ac_elements = document.querySelectorAll("#aircraft_types input:checked")
        ac_types = "/".join([el.value for el in ac_elements])
        
        loc_code = "CAL-EMO/CKS" if loc_choice == "桃園" else "CAL-EMO/KHH"
        
        # 填寫第一頁 (Paragraph 10)
        for p in doc.paragraphs:
            if "姓名(Name)" in p.text and "員工號(ID)" in p.text:
                # 保留原有空格，精確替換
                p.text = p.text.replace("姓名(Name) :", f"姓名(Name) : {name}")
                p.text = p.text.replace("員工號(ID) :", f"員工號(ID) : {id_no}")
                break

        # 填寫第九頁個人資訊 (Table 0, 1, 2)
        # Table 0: Trainee Data
        t0 = doc.tables[0]
        t0.rows[1].cells[1].text = name[0] if name else ""
        t0.rows[1].cells[3].text = name[1:] if len(name) > 1 else ""
        
        # Table 1: License - 填寫到標籤後的第 1, 2, 3 格 (Index 1, 2, 3)
        t1 = doc.tables[1]
        t1.rows[0].cells[1].text = "台灣"
        t1.rows[0].cells[2].text = license_no
        t1.rows[0].cells[3].text = license_type
        
        # Table 2: Employment
        t2 = doc.tables[2]
        t2.rows[0].cells[1].text = "中華航空"
        t2.rows[0].cells[4].text = "中華航空"
        t2.rows[1].cells[2].text = hire_date
        t2.rows[1].cells[5].text = hire_date
        t2.rows[1].cells[3].text = "迄今"
        t2.rows[1].cells[7].text = "迄今"
        
        # 尋找職務與工作性質的格子 (Table 2 下半部)
        for row in t2.rows:
            for cell in row.cells:
                if "職務" in cell.text:
                    cell.text = f"職務 (Position): {position}"
                elif "工作性質" in cell.text:
                    cell.text = f"工作性質 (Work Nature): 飛機修護"
                elif "工作機型" in cell.text:
                    cell.text = f"工作機型或產品類型(Aircraft/product Type): {ac_types}"

        # 填寫第九頁剩餘資訊 (生日、國籍、地址)
        for table in doc.tables[:3]:
            for row in table.rows:
                for cell in row.cells:
                    if "生日" in cell.text: cell.text = f"生日 (Date of Birth): {birthday}"
                    elif "國籍" in cell.text: cell.text = f"國籍 (Nationality): {nationality}"
                    elif "永久住址" in cell.text: cell.text = f"永久住址 (Permanent Address): {address}"

        update_progress(40, "處理工作經歷分頁...", 8)
        await asyncio.sleep(0.1)

        # 處理第十三頁工作經歷 (Table 4)
        log_table_template = doc.tables[4]
        
        # 刪除模板中的原始數據列 (保留標題兩列)
        while len(log_table_template.rows) > 2:
            tbl = log_table_template._tbl
            tbl.remove(log_table_template.rows[-1]._tr)

        # 獲取標題段落 (第 5 節標題)
        title_para = None
        for p in doc.paragraphs:
            if "Maintenance Experience records" in p.text:
                title_para = p
                break

        # 分頁填寫
        total_records = len(df)
        records_per_page = 7
        
        for i in range(0, total_records, records_per_page):
            update_progress(40 + int(50 * (i/total_records)), f"正在填寫第 {i//7 + 1} 頁...", 5)
            
            if i == 0:
                current_table = log_table_template
            else:
                # 插入分頁與標題
                doc.add_page_break()
                if title_para:
                    new_p = doc.add_paragraph(title_para.text)
                    new_p.style = title_para.style
                
                # 複製表格結構
                new_tbl = copy.deepcopy(log_table_template._tbl)
                doc._body._element.append(new_tbl)
                current_table = doc.tables[-1]
                # 清空複製過來的數據列 (只留標題)
                while len(current_table.rows) > 2:
                    current_table._tbl.remove(current_table.rows[-1]._tr)

            # 填寫 7 筆數據
            for j in range(7):
                row_cells = current_table.add_row().cells
                # 設定固定列高 28pt
                tr = current_table.rows[-1]._tr
                tr_pr = tr.get_or_add_trPr()
                tr_height = tr_pr.get_or_add_trHeight()
                tr_height.val = 560 # 28pt * 20
                tr_height.hRule = WD_ROW_HEIGHT_RULE.EXACTLY

                if i + j < total_records:
                    record = df.iloc[i + j]
                    
                    # 獲取數據
                    r_date = str(record.get('日期', ''))[:10]
                    r_reg = str(record.get('機號', ''))
                    r_time = str(record.get('實際工時', ''))
                    r_desc = str(record.get('任務描述', ''))
                    r_barcode = str(record.get('任務條碼', ''))
                    
                    # 機型自動判斷
                    r_type = ""
                    if r_reg.startswith("B-181"): r_type = "321-200"
                    elif r_reg.startswith("B-183"): r_type = "330-300"
                    elif r_reg.startswith("B-189"): r_type = "350-900"
                    elif r_reg.startswith("B-180"): r_type = "777-300ER"
                    elif r_reg.startswith("B-1877"): r_type = "777-300F"
                    elif r_reg.startswith("B-187"): r_type = "744-400F"
                    elif r_reg.startswith("B-186"): r_type = "738-800"
                    
                    # 填寫格子 (精確索引)
                    # 0: Date, 1: Loc, 2: Type, 3: Reg, 4: Rating, 5: Privilege
                    # 17: Perform(V), 21: Op, 22: Time, 23: Barcode
                    row_cells[0].text = r_date
                    row_cells[1].text = loc_code
                    row_cells[2].text = r_type
                    row_cells[3].text = r_reg
                    row_cells[4].text = "A1-Line"
                    row_cells[5].text = license_type
                    
                    # Perform V
                    p_v = row_cells[17].paragraphs[0]
                    p_v.clear()
                    run_v = p_v.add_run("V")
                    run_v.font.name = "Arial"
                    
                    row_cells[21].text = r_desc
                    row_cells[22].text = r_time
                    row_cells[23].text = r_barcode
                    
                    # 設定字體大小
                    for cell in row_cells:
                        for para in cell.paragraphs:
                            for run in para.runs:
                                run.font.size = Pt(8)
                    # 任務描述字體更小
                    for para in row_cells[21].paragraphs:
                        for run in para.runs:
                            run.font.size = Pt(7)
                else:
                    # 補足空白列，維持列高
                    pass

        update_progress(95, "正在封裝檔案...", 2)
        await asyncio.sleep(0.1)

        # 儲存檔案
        out_io = io.BytesIO()
        doc.save(out_io)
        content = out_io.getvalue()
        
        # 下載
        js_array = Uint8Array.new(len(content))
        js_array.assign(content)
        file = File.new([js_array], f"填寫完成_{name}.docx", { "type": "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })
        url = URL.createObjectURL(file)
        
        hidden_link = document.createElement("a")
        hidden_link.href = url
        hidden_link.download = f"填寫完成_{name}.docx"
        document.body.appendChild(hidden_link)
        hidden_link.click()
        document.body.removeChild(hidden_link)
        URL.revokeObjectURL(url)

        update_progress(100, "處理完成！檔案已下載", 0)
        window.alert("處理完成！")

    except Exception as ex:
        window.alert(f"處理失敗: {str(ex)}")
        print(ex)

# 綁定按鈕
def setup():
    btn = document.getElementById("process_btn")
    btn.onclick = create_proxy(process_word)
    document.getElementById("loading_overlay").style.display = "none"

setup()
    </script>
</body>
</html>
